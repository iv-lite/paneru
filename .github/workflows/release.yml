name: paneru-swift-release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_version:
        description: Publish a release with this version (e.g. 0.5.1). Leave empty for artifacts only.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Swift-only: the daemon is `swift-daemon/` (product `paneru-swift`). The
# Rust tree still ships until cutover but is deliberately out of this
# workflow — no cargo/sccache/nextest, no Rust trace corpus.

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build the Swift package
        run: swift build --package-path swift-daemon
      - name: Run Swift checks
        run: |
          set -euo pipefail
          for checks in GeometryChecks LayoutChecks AXClientChecks EventCoreChecks \
            PresentationChecks PresenterChecks ScriptingChecks IPCChecks ServiceChecks \
            CommandsChecks DaemonChecks XPCChecks FocusChecks WorkspaceChecks \
            ConfigChecks KeyChordsChecks SnippetChecks ProviderChecks WorkerChecks \
            DisplaysChecks SessionChecks SkyBridgeChecks WindowSetChecks \
            StateQueryChecks LuaAPIChecks ConfigFilesChecks ScriptHostChecks \
            ScriptEventsChecks LuaBridgeChecks MenuBarChecks LiveProvidersChecks \
            AnimationChecks ScrollChecks; do
            echo "== $checks =="
            swift run --package-path swift-daemon "$checks"
          done
      # Frame parity replays a Rust trace corpus (`PANERU_TRACE_DIR`). No
      # corpus is produced in this Swift-only workflow, so the runner skips
      # cleanly — kept here so a future corpus still gates.
      - name: Frame parity (skips without a corpus)
        run: swift run --package-path swift-daemon FrameParityChecks

  # Builds the release artifacts concurrently with `checks`; publishing stays
  # gated on green checks in the `publish` job below.
  build-release:
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.release-info.outputs.tag }}
    # Plain branch pushes stop after checks; release artifacts are only
    # built for version tags and manual dispatches.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version

      - name: Resolve release version and tag
        id: release-info
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$RELEASE_VERSION" ]]; then
            echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}

      - name: Build the release binaries
        run: swift build -c release --package-path swift-daemon

      - name: Pin code-signing identifier
        # Ad-hoc with the stable identifier (mirrors the Rust release step):
        # the installer re-signs with the persistent identity on the host,
        # so the shipped signature only needs to be well-formed and carry
        # the identifier TCC expects.
        run: |
          BIN="$(swift build -c release --package-path swift-daemon --show-bin-path)"
          codesign --force --sign - --identifier com.github.iv-lite.paneru-swift "$BIN/paneru-swift"
          codesign -dv "$BIN/paneru-swift" 2>&1 | grep 'Identifier=com.github.iv-lite.paneru-swift'
          codesign --verify --strict "$BIN/paneru-swift"

      - name: Stage release archive
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --package-path swift-daemon --show-bin-path)"
          STAGE="$RUNNER_TEMP/stage/paneru-swift-aarch64-apple-darwin"
          mkdir -p "$STAGE"
          cp "$BIN/paneru-swift" "$BIN/pq" "$STAGE/"
          cp README.md CONFIGURATION.md SCRIPTING.md LICENSE.txt "$STAGE/"
          tar -czf "$RUNNER_TEMP/paneru-swift-aarch64-apple-darwin.tar.gz" \
            -C "$RUNNER_TEMP/stage" paneru-swift-aarch64-apple-darwin
          tar -tzf "$RUNNER_TEMP/paneru-swift-aarch64-apple-darwin.tar.gz"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paneru-swift-macos
          path: ${{ runner.temp }}/paneru-swift-aarch64-apple-darwin.tar.gz

  publish:
    runs-on: macos-latest
    timeout-minutes: 15
    needs: [checks, build-release]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paneru-swift-macos
          path: ${{ runner.temp }}

      - name: Create GitHub Release
        if: ${{ needs.build-release.outputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          name: paneru-swift ${{ needs.build-release.outputs.tag }}
          tag_name: ${{ needs.build-release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: ${{ runner.temp }}/paneru-swift-aarch64-apple-darwin.tar.gz
